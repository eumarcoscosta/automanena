<style>
:root {
  --navy: #0d1b2a;
  --gold: #c9933a;
  --white: #ffffff;
  --text: #e8e4de;
  --muted: rgba(232,228,222,.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  min-height: 100%;
  background: var(--navy);
  font-family: 'Jost', sans-serif;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}
.wrap {
  text-align: center;
  max-width: 480px;
}
.icon {
  width: 64px;
  height: 64px;
  margin: 0 auto 28px;
  opacity: .85;
}
.rule {
  width: 40px;
  height: 2px;
  background: var(--gold);
  margin: 0 auto 28px;
}
.tag {
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  color: var(--gold);
  font-weight: 600;
  margin-bottom: 14px;
  display: block;
}
h1 {
  font-size: 26px;
  font-weight: 300;
  line-height: 1.35;
  margin-bottom: 16px;
  color: var(--white);
}
h1 strong { font-weight: 600; }
p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
  margin-bottom: 32px;
}
.cta {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  background: var(--gold);
  color: var(--white);
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  padding: 13px 26px;
  border-radius: 8px;
  transition: opacity .15s;
}
.cta:hover { opacity: .85; }
.cta svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
.footer {
  margin-top: 48px;
  font-size: 11px;
  color: rgba(232,228,222,.28);
  letter-spacing: .04em;
}
</style>
</head>
