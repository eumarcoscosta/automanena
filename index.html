<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Automanena</title>
  <link rel="icon" type="image/png" href="images/logo/logo-automanena.png">
  <link rel="apple-touch-icon" href="images/logo/logo-automanena.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Oxanium:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #E9021E;
      --dark: #121212;
      --dark2: #1c1c1c;
      --white: #fff;
      --gray: #888;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--dark);
      color: var(--white);
      font-family: 'Manrope', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 32px 24px;
      padding-top: max(32px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      text-align: center;
    }

    .logo {
      width: 180px;
      max-width: 60vw;
      margin-bottom: 48px;
      opacity: 0.95;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: var(--red);
      border-radius: 2px;
      margin: 0 auto 32px;
    }

    .title {
      font-family: 'Oxanium', sans-serif;
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      font-weight: 400;
      color: var(--gray);
      max-width: 380px;
      line-height: 1.7;
    }

    .dot {
      display: inline-block;
      color: var(--red);
    }

    .footer {
      position: fixed;
      bottom: max(20px, env(safe-area-inset-bottom));
      font-size: 0.78rem;
      color: #444;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --dark: #f5f5f5;
        --dark2: #e8e8e8;
        --white: #111;
        --gray: #555;
      }
      .footer { color: #bbb; }
    }
  </style>
</head>
<body>
  <img src="images/logo/logo-automanena.png" alt="Automanena" class="logo">
  <div class="divider"></div>
  <h1 class="title">Site em Manutenção<span class="dot">.</span></h1>
  <p class="subtitle">Estamos a trabalhar para melhorar a sua experiência. Voltamos em breve.</p>
  <p class="footer">Automanena &mdash; Alcabideche</p>
</body>
</html>
